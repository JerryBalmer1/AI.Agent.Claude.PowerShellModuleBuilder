# case-09  Two references that cannot be resolved, for two different reasons:
# a file that does not exist, and a repository alias that was never declared.
# This definition would fail if run. It is never run.
trigger: none
pool:
  vmImage: ubuntu-latest
resources:
  repositories:
    - repository: sharedTemplates
      type: git
      name: ClaudeTesting/templates-shared
steps:
  - template: templates/missing-steps.yml
  - template: steps/common.yml@ghostTemplates
